openapi: 3.1.0
info:
  title: ASM Core Schemas
  version: 2026.09.0
  description: Shared root-reachable core model components used by instrument specifications.
components:
  schemas:
    CoreCustomInformationAggregateDocument:
      type: object
      properties:
        custom information document:
          type: array
          items:
            $ref: '#/components/schemas/CoreCustomInformationDocument'
      required:
      - custom information document
    CoreCalculatedDataAggregateDocument:
      type: object
      properties:
        calculated data document:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoreCalculatedDataDocument'
      required:
      - calculated data document
    CoreDataSourceAggregateDocument:
      type: object
      properties:
        data source document:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoreDataSourceDocument'
      required:
      - data source document
    CoreElectronicProjectRecord:
      type: object
      properties:
        description: {}
        start time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        written name:
          type: string
      required:
      - written name
    AnalysisSequenceDocument:
      type: object
      properties:
        UNC path:
          description: "An UNC path is a file path for a file location in a network that is specified by the universal naming convention. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: '#/components/schemas/CoreCustomInformationAggregateDocument'
        end time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        file name:
          description: "A file name is a name that denotes a file in a file system. It is a local identifier in the scope of the folder the file is located. [Allotrope]"
          type: string
        identifier:
          description: "An identifier is a name that identifies (that is, labels the identity of) either a unique object or a unique class of objects, where the \"object\" or class may be an idea, physical [countable] object (or class thereof), or physical [uncountable] substance (or class thereof). [Wikipedia]"
          type: string
        method identifier:
          description: "A method identifier is an identifier that identifies some plan specification (method, procedure) about some planned process. [Allotrope]"
          type: string
        method name:
          description: "A method name is a name that denotes a plan specification (method). [Allotrope]"
          type: string
        start time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        version number:
          description: "A version number is an information content entity which is a sequence of characters borne by part of each of a class of manufactured products or its packaging and indicates its order within a set of other products having the same name. [IAO]"
          type: string
        written name:
          description: "A textual entity that denotes a particular in reality. [IAO]"
          type: string
      required:
      - written name
    CoreElectronicSignatureAggregateDocument:
      type: object
      properties:
        electronic signature document:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CoreElectronicSignatureDocument'
    CoreProcessedDataAggregateDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: '#/components/schemas/CoreCustomInformationAggregateDocument'
        electronic project record:
          $ref: '#/components/schemas/CoreElectronicProjectRecord'
        processed data document:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProcessedDataDocument'
      required:
      - processed data document
    CoreMatchResultAggregateDocument:
      type: object
      properties:
        match result document:
          type: array
          items:
            $ref: '#/components/schemas/MatchResultDocument'
    CoreStatisticsAggregateDocument:
      type: object
      properties:
        statistics document:
          type: array
          items:
            $ref: '#/components/schemas/CoreStatisticsDocument'
    CoreLog:
      type: object
      properties:
        custom information aggregate document:
          $ref: '#/components/schemas/CoreCustomInformationAggregateDocument'
        log entry:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CoreLogEntry'
    CoreErrorAggregateDocument:
      type: object
      properties:
        error document:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CoreErrorDocument'
    CoreImageAggregateDocument:
      type: object
      properties:
        image document:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CoreImageDocument'
    CoreTNamed:
      type: string
      description: A reference to an arbitrary RDF resource identified by a SKOS preferred label. The label MUST be unique.
    CoreCustomInformationDocument:
      type: object
      description: >-
        Flat custom-information datum model. Datum alternatives are optional independent
        primitive properties rather than oneOf schemas so generated clients avoid anonymous
        branch types. This model does not enforce that exactly one datum field is present
        and does not represent the typed-object alternatives of the ASM scalar value schemas.
      properties:
        datum label:
          type: string
        description: {}
        identifier:
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
        scalar double datum:
          type: number
          format: double
        unit:
          type: string
        scalar string datum:
          type: string
        scalar timestamp datum:
          type: string
          format: date-time
        scalar boolean datum:
          type: boolean
      required:
      - datum label
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    CoreCalculatedDataDocument:
      type: object
      properties:
        calculated data identifier:
          type: string
        calculated data name:
          type: string
        calculated result:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        calculation description:
          type: string
        data source aggregate document:
          $ref: '#/components/schemas/CoreDataSourceAggregateDocument'
        electronic project record:
          $ref: '#/components/schemas/CoreElectronicProjectRecord'
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - calculated data name
      - calculated result
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    CoreDataSourceDocument:
      type: object
      properties:
        data source feature:
          type: string
        data source identifier:
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - data source identifier
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    CoreElectronicSignatureDocument:
      type: object
      properties:
        account identifier:
          type: string
        identifier:
          type: string
        measurement identifier:
          type: string
        method identifier:
          type: string
        personal name:
          type: string
        processed data identifier:
          type: string
        signature role type:
          type: string
        time:
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - account identifier
      - personal name
      - signature role type
      - time
      anyOf:
      - required:
        - identifier
      - required:
        - measurement identifier
      - required:
        - processed data identifier
      - required:
        - method identifier
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
