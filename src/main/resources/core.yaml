    CoreLogEntry:
      type: object
      properties:
        author:
          type: string
        custom information aggregate document:
          $ref: '#/components/schemas/CoreCustomInformationAggregateDocument'
        elapsed time:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              type: string
              enum:
              - min
        identifier:
          type: string
        log source name:
          type: string
        observation:
          type: string
        scalar timestamp datum:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        elapsed volume:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              type: string
              enum:
              - mL
      required:
      - observation
      - scalar timestamp datum
    CoreErrorDocument:
      type: object
      properties:
        error:
          type: string
        error feature:
          type: string
      required:
      - error
    CoreImageDocument:
      type: object
      properties:
        experimental data identifier:
          type: string
        index:
          $ref: ./common.yaml#/components/schemas/IntegerValue
    ProcessedDataDocument:
      type: object
      properties:
        calculated data aggregate document:
          $ref: '#/components/schemas/CoreCalculatedDataAggregateDocument'
        custom information aggregate document:
          $ref: '#/components/schemas/CoreCustomInformationAggregateDocument'
        data processing document:
          $ref: '#/components/schemas/DataProcessingDocument'
        data source aggregate document:
          $ref: '#/components/schemas/CoreDataSourceAggregateDocument'
        description: {}
        electronic project record:
          $ref: '#/components/schemas/CoreElectronicProjectRecord'
        group identifier:
          type: string
        match result aggregate document:
          $ref: '#/components/schemas/CoreMatchResultAggregateDocument'
        processed data identifier:
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    MatchResultDocument:
      type: object
      properties:
        InChI molecular structure:
          type: string
        InChIKey molecular structure:
          type: string
        Molfile molecular structure:
          type: string
        SMILES molecular structure:
          type: string
        conformance assessment:
          type: string
        database identifier:
          type: string
        description: {}
        fingerprint identifier:
          type: string
        match quality index aggregate document:
          $ref: '#/components/schemas/MatchQualityIndexAggregateDocument'
        molecular formula:
          type: string
        reference identifier:
          type: string
        synonym aggregate document:
          $ref: '#/components/schemas/SynonymAggregateDocument'
    DataProcessingDocument:
      type: object
      properties:
        data processing time:
          $ref: ./common.yaml#/components/schemas/DateTimeStampValue
        data processing type:
          type: string
        method identifier:
          type: string
        method name:
          type: string
        method version:
          type: string
    MatchQualityIndexAggregateDocument:
      type: object
      properties:
        match quality index document:
          type: array
          items:
            $ref: '#/components/schemas/MatchQualityIndexDocument'
    MatchQualityIndexDocument:
      type: object
      properties:
        algorithm name:
          type: string
        description: {}
        lower limit:
          $ref: ./common.yaml#/components/schemas/DoubleValue
        match quality index:
          $ref: ./common.yaml#/components/schemas/DoubleValue
        upper limit:
          $ref: ./common.yaml#/components/schemas/DoubleValue
      required:
      - match quality index
    SynonymAggregateDocument:
      type: object
      properties:
        synonym document:
          type: array
          items:
            $ref: '#/components/schemas/SynonymDocument'
    SynonymDocument:
      type: object
      properties:
        written name:
          type: string
      required:
      - written name
