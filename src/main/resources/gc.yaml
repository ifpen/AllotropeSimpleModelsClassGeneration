openapi: 3.1.0
info:
  title: ASM Gas-Chromatography Schemas
  version: 2026.09.0
  description: 'These schemas (and the generated classes) allow to read and write Allotrope Simple

    Models (ASM) for Gas Chromatography (GC), based on the REC/2026/09 tabular model.


    They rely on the Allotrope Foundation ontologies and data models.


    The classes are generated from the YAML schemas using OpenAPI Generator.


    **Complete API Documentation**: [https://ifpen.github.io/AllotropeSimpleModelsClassGeneration/](https://ifpen.github.io/AllotropeSimpleModelsClassGeneration/)

    '
components:
  schemas:
    gasChromatographySimpleModel:
      type: object
      required:
      - $asm.manifest
      properties:
        $asm.manifest:
          type: string
          enum:
          - http://purl.allotrope.org/manifests/gas-chromatography/REC/2026/09/gas-chromatography.tabular.manifest
          default: http://purl.allotrope.org/manifests/gas-chromatography/REC/2026/09/gas-chromatography.tabular.manifest
        gas chromatography aggregate document:
          $ref: '#/components/schemas/gasChromatographyAggregateDocument'
    gasChromatographyAggregateDocument:
      type: object
      properties:
        analysis sequence document:
          $ref: ./core.yaml#/components/schemas/AnalysisSequenceDocument
        device system document:
          $ref: '#/components/schemas/deviceSystemDocument'
        gas chromatography document:
          description: A gas chromatography document is a document that encompasses the information associated with a gas chromatography run. [Allotrope]
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/gasChromatographyDocument'
      required:
      - gas chromatography document
    deviceSystemDocument:
      type: object
      properties:
        detector model number:
          description: A detector model number is a model number that denotes some class of detectors. [Allotrope]
          type: string
        asset management identifier:
          description: An asset management identifier is an identifier that is registered within an asset / inventory management system that identifies an equipment. [Allotrope]
          type: string
        brand name:
          description: A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        description:
          description: A description is a proposition about an existing entity. [Allotrope]
        device document:
          description: A device document is a document that encompasses the information associated with a device. [Allotrope]
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/deviceDocument'
        device identifier:
          description: A device identifier is an identifier that identifies some device. [Allotrope]
          type: string
        equipment serial number:
          description: Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]
          type: string
        firmware version:
          description: A firmware version is a version number that identifies the firmware of a device. [Allotrope]
          type: string
        model number:
          description: A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]
          type: string
        product manufacturer:
          description: A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]
          type: string
        pump model number:
          description: A pump model number is a model number that denotes some class of pumps. [Allotrope]
          type: string
    deviceDocument:
      type: object
      properties:
        brand name:
          description: A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]
          type: string
        device identifier:
          description: A device identifier is an identifier that identifies some device. [Allotrope]
          type: string
        device type:
          description: A device type is a classification datum that classifies the type of device used. [Allotrope]
          type: string
        equipment serial number:
          description: Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]
          type: string
        firmware version:
          description: A firmware version is a version number that identifies the firmware of a device. [Allotrope]
          type: string
        model number:
          description: A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]
          type: string
        product manufacturer:
          description: A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]
          type: string
        written name:
          description: A textual entity that denotes a particular in reality. [IAO]
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - device type
    gasChromatographyDocument:
      type: object
      properties:
        analyst:
          description: Analyst is measurement metadata about the name or identifier of a person that has the role of an analyst in the measurement. [Allotrope]
          type: string
        device method identifier:
          description: A device method identifier is an identifier that identifies the device method used in a process. [Allotrope]
          type: string
        measurement aggregate document:
          $ref: '#/components/schemas/measurementAggregateDocument'
        submitter:
          description: Submitter is measurement metadata about the name or identifier of a person that has the role of a submitter in the measurement. [Allotrope]
          type: string
      required:
      - analyst
      - device method identifier
      - measurement aggregate document
    measurementAggregateDocument:
      type: object
      properties:
        diagnostic trace aggregate document:
          $ref: '#/components/schemas/diagnosticTraceAggregateDocument'
        measurement document:
          description: A measurement document is a document that encompasses the information associated with a measurement. [Allotrope]
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/measurementDocument'
      required:
      - measurement document
    measurementDocument:
      type: object
      properties:
        chromatogram data cube:
          $ref: '#/components/schemas/ChromatogramDataCube'
        chromatography column document:
          $ref: '#/components/schemas/chromatographyColumnDocument'
        device control aggregate document:
          $ref: '#/components/schemas/deviceControlAggregateDocument'
        injection document:
          $ref: '#/components/schemas/injectionDocument'
        processed data aggregate document:
          $ref: '#/components/schemas/processedDataAggregateDocument'
        sample document:
          $ref: '#/components/schemas/sampleDocument'
      required:
      - injection document
      - chromatography column document
    processedDataAggregateDocument:
      type: object
      properties:
        processed data document:
          description: A processed data document is a document that encompasses the output of some data processing operation. [Allotrope]
          type: array
          items:
            $ref: '#/components/schemas/processedDataDocument'
    processedDataDocument:
      type: object
      properties:
        peak list:
          $ref: '#/components/schemas/peakList'
      required:
      - peak list
    chromatographyColumnDocument:
      type: object
      properties:
        chromatography column chemistry type:
          description: A chromatography column chemistry type is a classification datum that classifies a chromatography column by the stationary phase and/or chromatographic packing used. [Allotrope]
          type: string
        chromatography column fill type:
          description: A chromatography column fill type is a classification datum that classifies a chromatography column by the form of the stationary phase in the column. [Allotrope]
          type: string
          enum:
          - monolithic column
          - weak cation-exchange column
          - analytical column
          - open-tubular column
          - capillary column
          - packed column
          - cation-exchange column
          - array column
          - weak anion-exchange column
          - strong cation-exchange column
          - high-performance liquid chromatography column
          - anion-exchange column
          - ion-exchange column
          - wall-coated open-tubular column
        chromatography column length:
          $ref: ./common.yaml#/components/schemas/MetersQuantityValue
        chromatography column part number:
          description: A column part number is a part number that denotes some class of chromatography columns. [Allotrope]
          type: string
        chromatography column particle size:
          $ref: ./common.yaml#/components/schemas/MicrometersQuantityValue
        chromatography column serial number:
          description: A column serial number is an equipment serial number that identifies some chromatography column. [Allotrope]
          type: string
        column inner diameter:
          $ref: ./common.yaml#/components/schemas/MillimetersQuantityValue
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        product manufacturer:
          description: A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]
          type: string
        written name:
          description: A textual entity that denotes a particular in reality. [IAO]
          type: string
    injectionDocument:
      type: object
      properties:
        injection identifier:
          description: An injection identifier is an identifier that identifies some injection. [Allotrope]
          type: string
        injection time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        injection volume setting:
          $ref: ./common.yaml#/components/schemas/MicrolitersQuantityValue
      required:
      - injection volume setting
      - injection identifier
      - injection time
    deviceControlAggregateDocument:
      type: object
      properties:
        device control document:
          description: A device control document is a document that encompasses the information associated with control of a device. [Allotrope]
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/deviceControlDocument'
      required:
      - device control document
    deviceControlDocument:
      type: object
      properties:
        brand name:
          description: A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        detection type:
          description: A detection type is a classification datum that classifies the type of detection performed by the detector.. [Allotrope]
          type: string
        detector offset setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        detector sampling rate setting:
          $ref: ./common.yaml#/components/schemas/HertzQuantityValue
        device identifier:
          description: A device identifier is an identifier that identifies some device. [Allotrope]
          type: string
        device type:
          description: A device type is a classification datum that classifies the type of device used. [Allotrope]
          type: string
        equipment serial number:
          description: Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]
          type: string
        firmware version:
          description: A firmware version is a version number that identifies the firmware of a device. [Allotrope]
          type: string
        model number:
          description: A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]
          type: string
        product manufacturer:
          description: A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - device type
    sampleDocument:
      type: object
      properties:
        batch identifier:
          description: A batch identifier is an identifier that identifies a batch. [Allotrope]
          type: string
        sampling type:
          description: A sampling type is a classification datum that classifies the type of sampling approach used to take a sample. [Allotrope]
          type: string
    peakList:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        peak:
          description: A peak is a data region containing a single local extremum in the dependent variable of the distribution function. [Allotrope]
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/peak'
    peak:
      type: object
      properties:
        capacity factor (chromatography):
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        chromatographic peak resolution:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        chromatographic peak resolution using baseline peak widths:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        chromatographic peak resolution using statistical moments:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        chromatographic peak resolution using peak width at half-height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        identifier:
          description: An identifier is a name that identifies (that is, labels the identity of) either a unique object or a unique class of objects, where the "object" or class may be an idea, physical [countable] object (or class thereof), or physical [uncountable] substance (or class thereof). [Wikipedia]
          type: string
        number of theoretical plates measured at 60.7 % of peak height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number of theoretical plates measured at 13.4 % of peak height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number of theoretical plates measured at 32.4 % of peak height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number of theoretical plates measured at 4.4 % of peak height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number of theoretical plates by tangent method:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number theoretical plates peak width at half height:
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number theoretical plates peak width at half height (JP14):
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        number theoretical plates (chromatography):
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        peak area:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        peak end:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        peak height:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        peak selectivity (chromatography):
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        peak start:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        peak width at 4.4 % height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at 32.4 % height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at half height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width baseline:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at 10 % of height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at 13.4 % height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at 60.7 % height:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width at inflection:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        peak width:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        relative peak area:
          $ref: ./common.yaml#/components/schemas/PercentQuantityValue
        relative peak height:
          $ref: ./common.yaml#/components/schemas/PercentQuantityValue
        retention time:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        retention volume:
          $ref: ./common.yaml#/components/schemas/MillilitersQuantityValue
        statistical skew (chromatography):
          $ref: ./common.yaml#/components/schemas/UnitlessQuantityValue
        written name:
          description: A textual entity that denotes a particular in reality. [IAO]
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      oneOf:
      - required:
        - retention time
      - required:
        - retention volume
    diagnosticTraceAggregateDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        diagnostic trace document:
          description: A diagnostic trace document is a document that encapsulates the information associated with a diagnostic trace. [Allotrope]
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/diagnosticTraceDocument'
      required:
      - diagnostic trace document
    diagnosticTraceDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        description:
          description: A description is a proposition about an existing entity. [Allotrope]
      required:
      - description
    ChromatogramDataCube:
      type: object
      properties:
        label:
          type: string
        cube-structure:
          $ref: '#/components/schemas/ChromatogramDatacubeStructure'
        data:
          $ref: '#/components/schemas/ChromatogramData'
      required: [cube-structure, data]
      description: ASM datacube with the canonical `cube-structure` and `data` properties.
    ChromatogramData:
      type: object
      description: Numeric chromatogram coordinates and measurements; modeled without unions.
      properties:
        dimensions:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
        measures:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
      required: [dimensions, measures]
    ChromatogramDatacubeStructure:
      type: object
      properties:
        dimensions:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/ChromatogramDimension'
        measures:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/ChromatogramMeasure'
    ChromatogramDimension:
      type: object
      description: >-
        Simple GC dimension component. The concept and unit are independently constrained to
        keep generation to one understandable class; their pairing is not validated here.
      properties:
        '@componentDatatype':
          type: string
          enum: [double]
          default: double
        concept:
          description: "An idea or notion; a unit of thought."
          type: string
          enum: [retention time, retention volume]
        unit:
          description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
          type: string
          enum: [s, mL]
      required: ['@componentDatatype', concept]
    ChromatogramMeasure:
      type: object
      description: Simple numeric GC measure component.
      properties:
        '@componentDatatype':
          type: string
          enum: [double]
          default: double
        concept:
          description: "An idea or notion; a unit of thought."
          type: string
        unit:
          description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
          type: string
      required: ['@componentDatatype', concept]
