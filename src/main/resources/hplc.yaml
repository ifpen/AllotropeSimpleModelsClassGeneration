openapi: 3.1.0
info:
  title: ASM Liquid Chromatography Schemas
  version: 2026.09.0
  description: Full root-reachable model for the Allotrope Simple Model Liquid Chromatography (tabular embed) REC/2026/09 schema.
components:
  schemas:
    liquidChromatographySimpleModel:
      type: object
      required:
      - $asm.manifest
      properties:
        liquid chromatography aggregate document:
          $ref: '#/components/schemas/liquidChromatographyAggregateDocument'
        $asm.manifest:
          type: string
          enum:
          - http://purl.allotrope.org/manifests/liquid-chromatography/REC/2026/09/liquid-chromatography.manifest
          default: http://purl.allotrope.org/manifests/liquid-chromatography/REC/2026/09/liquid-chromatography.manifest
    measurementAggregateDocument:
      type: object
      properties:
        analytical method identifier:
          description: "An analytical method identifier is an identifier that identifies the analytical method used in a measurement. [Allotrope]"
          type: string
        calculated data aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCalculatedDataAggregateDocument
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        diagnostic trace aggregate document:
          $ref: '#/components/schemas/DiagnosticTraceAggregateDocument'
        error aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreErrorAggregateDocument
        experimental data identifier:
          description: "An experiment data identifier is an identifier that identifies some experiment data. [Allotrope]"
          type: string
        image aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreImageAggregateDocument
        measurement document:
          description: "A measurement document is a document that encompasses the information associated with a measurement. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LiquidChromatographyMeasurementDocument'
        method version:
          description: "A method version is a version number that identifies a method. [Allotrope]"
          type: string
        processed data aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreProcessedDataAggregateDocument
        statistics aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreStatisticsAggregateDocument
      required:
      - measurement document
    LiquidChromatographyMeasurementDocument:
      type: object
      properties:
        analytical method identifier:
          description: "An analytical method identifier is an identifier that identifies the analytical method used in a measurement. [Allotrope]"
          deprecated: true
          type: string
        calculated data aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCalculatedDataAggregateDocument
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        detection type:
          description: "A detection type is a classification datum that classifies the type of detection performed by the detector.. [Allotrope]"
          type: string
        device control aggregate document:
          $ref: '#/components/schemas/DeviceControlAggregateDocument'
        duration:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        electronic project record:
          $ref: ./core.yaml#/components/schemas/CoreElectronicProjectRecord
        error aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreErrorAggregateDocument
        experimental data identifier:
          description: "An experiment data identifier is an identifier that identifies some experiment data. [Allotrope]"
          deprecated: true
          type: string
        image aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreImageAggregateDocument
        measurement identifier:
          description: "Measurement id is measurement metadata that identifies the measuring run. [Allotrope]"
          type: string
        measurement time:
          $ref: ./common.yaml#/components/schemas/DateTimeStampValue
        method version:
          description: "A method version is a version number that identifies a method. [Allotrope]"
          deprecated: true
          type: string
        processed data aggregate document:
          $ref: '#/components/schemas/MeasurementProcessedDataAggregateDocument'
        sample document:
          $ref: '#/components/schemas/SampleDocument'
        statistics aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreStatisticsAggregateDocument
        chromatogram data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        chromatography column document:
          $ref: '#/components/schemas/ChromatographyColumnDocument'
        injection document:
          $ref: '#/components/schemas/InjectionDocument'
        three-dimensional ultraviolet spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        absorption spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        transmittance spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        fluorescence emission profile data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        fluorescence emission spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        fluorescence excitation spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        mass chromatogram data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        data processing aggregate document:
          $ref: '#/components/schemas/MeasurementDataProcessingAggregateDocument'
        sample introduction document:
          $ref: '#/components/schemas/SampleIntroductionDocument'
        mass spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
        three-dimensional mass spectrum data cube:
          $ref: ./datacube.yaml#/components/schemas/AsmDatacube
      required:
      - sample document
      - device control aggregate document
      - chromatography column document
    liquidChromatographyAggregateDocument:
      type: object
      properties:
        analysis sequence document:
          $ref: ./core.yaml#/components/schemas/AnalysisSequenceDocument
        calculated data aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCalculatedDataAggregateDocument
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        data system document:
          $ref: '#/components/schemas/dataSystemDocument'
        device system document:
          $ref: '#/components/schemas/deviceSystemDocument'
        electronic project record:
          $ref: ./core.yaml#/components/schemas/CoreElectronicProjectRecord
        electronic signature aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreElectronicSignatureAggregateDocument
        processed data aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreProcessedDataAggregateDocument
        statistics aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreStatisticsAggregateDocument
        liquid chromatography document:
          description: "A liquid chromatography document is a document that encompasses the information associated with a liquid chromatography run. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/liquidChromatographyDocument'
      required:
      - liquid chromatography document
    dataSystemDocument:
      type: object
      properties:
        ASM conversion time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
        ASM converter name:
          description: "An ASM converter name is a written name of some software used to convert data into the Allotrope Simple Model format. [Allotrope]"
          type: string
        ASM converter version:
          description: "An ASM converter version is a software version specifying the version of an ASM converter used to convert data into the Allotrope Simple Model format. [Allotrope]"
          type: string
        ASM file identifier:
          description: "An ASM file identifier is an identifier that identifies some ASM file. [Allotrope]"
          type: string
        UNC path:
          description: "An UNC path is a file path for a file location in a network that is specified by the universal naming convention. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        data system instance identifier:
          description: "A data system instance identifier is an identifier that identifies an instance of some data system. [Allotrope]"
          type: string
        database primary key:
          description: "A database primary key is an identifier of a database record. [Allotrope]"
          type: string
        file name:
          description: "A file name is a name that denotes a file in a file system. It is a local identifier in the scope of the folder the file is located. [Allotrope]"
          type: string
        software name:
          description: "A software name is a name of some software. [Allotrope]"
          type: string
        software version:
          description: "A version number that identifies software. [Allotrope]"
          type: string
      required:
      - ASM file identifier
      - data system instance identifier
      oneOf:
      - required:
        - UNC path
        - file name
      - required:
        - database primary key
    deviceSystemDocument:
      type: object
      properties:
        asset management identifier:
          description: "An asset management identifier is an identifier that is registered within an asset / inventory management system that identifies an equipment. [Allotrope]"
          type: string
        brand name:
          description: "A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        description: {description: "A description is a proposition about an existing entity. [Allotrope]"}
        device document:
          description: "A device document is a document that encompasses the information associated with a device. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/deviceDocument'
        device identifier:
          description: "A device identifier is an identifier that identifies some device. [Allotrope]"
          type: string
        equipment serial number:
          description: "Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]"
          type: string
        firmware version:
          description: "A firmware version is a version number that identifies the firmware of a device. [Allotrope]"
          type: string
        model number:
          description: "A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]"
          type: string
        product manufacturer:
          description: "A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]"
          type: string
        detector model number:
          description: "A detector model number is a model number that denotes some class of detectors. [Allotrope]"
          type: string
        pump model number:
          description: "A pump model number is a model number that denotes some class of pumps. [Allotrope]"
          type: string
    deviceDocument:
      type: object
      properties:
        brand name:
          description: "A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        device identifier:
          description: "A device identifier is an identifier that identifies some device. [Allotrope]"
          type: string
        device type:
          description: "A device type is a classification datum that classifies the type of device used. [Allotrope]"
          type: string
        equipment serial number:
          description: "Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]"
          type: string
        firmware version:
          description: "A firmware version is a version number that identifies the firmware of a device. [Allotrope]"
          type: string
        model number:
          description: "A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]"
          type: string
        product manufacturer:
          description: "A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]"
          type: string
        written name:
          description: "A textual entity that denotes a particular in reality. [IAO]"
          type: string
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - device type
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    liquidChromatographyDocument:
      type: object
      properties:
        analyst:
          description: "Analyst is measurement metadata about the name or identifier of a person that has the role of an analyst in the measurement. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        electronic project record:
          $ref: ./core.yaml#/components/schemas/CoreElectronicProjectRecord
        log:
          $ref: ./core.yaml#/components/schemas/CoreLog
        submitter:
          description: "Submitter is measurement metadata about the name or identifier of a person that has the role of a submitter in the measurement. [Allotrope]"
          type: string
        measurement aggregate document:
          $ref: '#/components/schemas/measurementAggregateDocument'
        fraction aggregate document:
          $ref: '#/components/schemas/FractionAggregateDocument'
      required:
      - measurement aggregate document
      - analyst
    FractionAggregateDocument:
      properties:
        fraction document:
          description: "A fraction document is a document that encompasses the information associated with a fraction. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FractionDocument'
    FractionDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        end time:
          $ref: ./common.yaml#/components/schemas/DateTimeStampValue
        end trigger reason:
          description: "An end trigger reason is a description of the justification for the end of some process. [Allotrope]"
          type: string
        identifier:
          description: "An identifier is a name that identifies (that is, labels the identity of) either a unique object or a unique class of objects, where the \"object\" or class may be an idea, physical [countable] object (or class thereof), or physical [uncountable] substance (or class thereof). [Wikipedia]"
          type: string
        location aggregate document:
          $ref: '#/components/schemas/LocationAggregateDocument'
        start time:
          $ref: ./common.yaml#/components/schemas/DateTimeStampValue
        start trigger reason:
          description: "A start trigger reason is a description of the justification for the start of some process. [Allotrope]"
          type: string
        start volume:
          $ref: ./common.yaml#/components/schemas/MicrolitersQuantityValue
        volume:
          $ref: ./common.yaml#/components/schemas/MicrolitersQuantityValue
        written name:
          description: "A textual entity that denotes a particular in reality. [IAO]"
          type: string
      required:
      - volume
      - location aggregate document
    LocationAggregateDocument:
      properties:
        location document:
          description: "A location document is a document that encompasses the information associated with some location. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocationDocument'
      required:
      - location document
    LocationDocument:
      type: object
      properties:
        location identifier:
          description: "A location identifier is an identifier that identifies some location or site. [Allotrope]"
          type: string
        vial location identifier:
          description: "A vial location identifier is a local identifier that identifies the location of a vial in the vial container in the scope of the vial container. [Allotrope]"
          type: string
        well location identifier:
          description: "A well location identifier is a local identifier that identifies the location of a well on the container in the scope of the container. [Allotrope]"
          type: string
      anyOf:
      - required:
        - location identifier
      - required:
        - vial location identifier
      - required:
        - well location identifier
    DeviceControlAggregateDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        device control document:
          description: "A device control document is a document that encompasses the information associated with control of a device. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeviceControlDocument'
      required:
      - device control document
    DeviceControlDocument:
      type: object
      properties:
        brand name:
          description: "A brand name is a marketed name given by a maker of a product to a product or class of products, especially a trademark. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        detection type:
          description: "A detection type is a classification datum that classifies the type of detection performed by the detector.. [Allotrope]"
          type: string
        device identifier:
          description: "A device identifier is an identifier that identifies some device. [Allotrope]"
          type: string
        device type:
          description: "A device type is a classification datum that classifies the type of device used. [Allotrope]"
          type: string
        duration setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        equipment serial number:
          description: "Equipment serial number is a serial number that identifies an equipment used in the measuring by its serial number. [Allotrope]"
          type: string
        firmware version:
          description: "A firmware version is a version number that identifies the firmware of a device. [Allotrope]"
          type: string
        model number:
          description: "A model number is an information content entity specifically borne by catalogs, design specifications, advertising materials, inventory systems and similar that is about manufactured objects of the same class. The model number is an alternative term for the class. [IAO]"
          type: string
        product manufacturer:
          description: "A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]"
          type: string
        profile setting aggregate document:
          $ref: '#/components/schemas/ProfileSettingAggregateDocument'
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
        detector offset setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        detector sampling rate setting:
          $ref: ./common.yaml#/components/schemas/HertzQuantityValue
        detector bandwidth setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        detector wavelength setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        electronic absorbance bandwidth setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        electronic absorbance reference bandwidth setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        electronic absorbance reference wavelength setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        electronic absorbance wavelength setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        excitation bandwidth setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        excitation wavelength setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - nm
        number of scans setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - '#'
          required:
          - unit
        polarization orientation setting:
          $ref: ./core.yaml#/components/schemas/CoreTNamed
        read interval setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        total measurement time setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        detection duration setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        detector relative offset setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        m/z maximum setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - m/z
        m/z minimum setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - m/z
        measurement mode setting:
          description: "A measurement mode setting is a control setting that specifies the measurement mode of some measurement process. [Allotrope]"
          type: string
        polarity setting:
          $ref: ./core.yaml#/components/schemas/CoreTNamed
      required:
      - device type
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    ProfileSettingAggregateDocument:
      type: object
      properties:
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        profile setting document:
          description: "A profile setting document is a document that encompasses the information associated with some profile setting. [Allotrope]"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProfileSettingDocument'
      required:
      - profile setting document
    ProfileSettingDocument:
      type: object
      properties:
        control setting identifier:
          description: "A control setting identifier is an identifier that identifies some control setting. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        description: {description: "A description is a proposition about an existing entity. [Allotrope]"}
        duration setting:
          $ref: ./common.yaml#/components/schemas/SecondsQuantityValue
        end time setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        final setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        initial setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        profile setting feature:
          description: "A profile setting feature is a facet that defines the feature with the role of a description or classification of a property, characteristic or facet of some data with the contextual role of a setting datum. [Allotrope]"
          type: string
        rate setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        start time setting:
          $ref: ./common.yaml#/components/schemas/QuantityValue
        '@index':
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - profile setting feature
      - initial setting
      - final setting
      anyOf:
      - required:
        - duration setting
      - required:
        - start time setting
        - end time setting
      description: A schema for an array item, that is ordered in a not-natural way. This means that it MUST have an explicit @index property stating the position. The index value is a strict positive 32bit signed integer (excluding 0).
    SampleDocument:
      type: object
      properties:
        batch identifier:
          description: "A batch identifier is an identifier that identifies a batch. [Allotrope]"
          type: string
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        description: {description: "A description is a proposition about an existing entity. [Allotrope]"}
        location identifier:
          description: "A location identifier is an identifier that identifies some location or site. [Allotrope]"
          type: string
        material identifier:
          description: "A material identifier is a identifier that identifies a material. [Allotrope]"
          type: string
        sample identifier:
          type: string
          description: Sample id is a measurement metadata that identifies a sample being measured.
        sample preparation description:
          description: "A sample preparation description is a description of the sample preparation process. [Allotrope]"
          type: string
        sample role type:
          description: "A sample role type is a classification datum that classifies samples by the type of  sample role in the experiment. [Allotrope]"
          type: string
          enum:
          - control sample role
          - standard sample role
          - validation sample role
          - experiment sample role
          - sample role
          - spiked sample role
          - blank role
          - unknown sample role
          - calibration sample role
          - unspiked sample role
          - specimen role
          - quality control sample role
          - reference sample role
        written name:
          description: "A textual entity that denotes a particular in reality. [IAO]"
          type: string
      required:
      - sample identifier
    ChromatographyColumnDocument:
      type: object
      properties:
        chromatography column chemistry type:
          description: "A chromatography column chemistry type is a classification datum that classifies a chromatography column by the stationary phase and/or chromatographic packing used. [Allotrope]"
          type: string
        chromatography column length:
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - cm
        chromatography column part number:
          description: "A column part number is a part number that denotes some class of chromatography columns. [Allotrope]"
          type: string
        chromatography column particle size:
          $ref: ./common.yaml#/components/schemas/MicrometersQuantityValue
        chromatography column serial number:
          description: "A column serial number is an equipment serial number that identifies some chromatography column. [Allotrope]"
          type: string
        column inner diameter:
          $ref: ./common.yaml#/components/schemas/MillimetersQuantityValue
        custom information aggregate document:
          $ref: ./core.yaml#/components/schemas/CoreCustomInformationAggregateDocument
        product manufacturer:
          description: "A product manufacturer is a symbol that denotes the organizational entity manufacturing some entity with a product role (economic). [Allotrope]"
          type: string
        written name:
          description: "A textual entity that denotes a particular in reality. [IAO]"
          type: string
    InjectionDocument:
      type: object
      properties:
        autosampler injection volume setting (chromatography):
          $ref: ./common.yaml#/components/schemas/QuantityValue
          type: object
          properties:
            unit:
              description: "A unit symbol is a symbol that denotes some unit. [Allotrope]"
              type: string
              enum:
              - mm^3
        injection identifier:
          description: "An injection identifier is an identifier that identifies some injection. [Allotrope]"
          type: string
        injection time:
          $ref: ./common.yaml#/components/schemas/DateTimeValue
      required:
      - autosampler injection volume setting (chromatography)
      - injection identifier
