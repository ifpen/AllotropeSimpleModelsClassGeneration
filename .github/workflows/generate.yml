name: Generate and publish Allotrope models

on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/**.yaml'
      - 'generate.py'
      - 'verify_builds.py'
      - 'allotrope_gen/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.mise.toml'
      - 'openapitools.json'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Specs to generate (space-separated, empty = all)'
        required: false
        default: ''
      langs:
        description: 'Languages to generate (space-separated, empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (print commands only)'
        type: boolean
        default: false
      verify_builds:
        description: 'Build generated modules before publishing'
        type: boolean
        default: true
      prerelease:
        description: 'Pre-release label to publish (alpha.N, beta.N or rc.N; empty = release)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.select.outputs.modules }}
      specs: ${{ steps.select.outputs.specs }}
      langs: ${{ steps.select.outputs.langs }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.16'
      - id: select
        name: Resolve selected specs and languages
        env:
          REQUESTED_SPECS: ${{ github.event.inputs.specs }}
          REQUESTED_LANGS: ${{ github.event.inputs.langs }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from allotrope_gen.config import LANGUAGES, SPECS

          specs = os.environ["REQUESTED_SPECS"].split() or list(SPECS)
          langs = os.environ["REQUESTED_LANGS"].split() or list(LANGUAGES)
          unknown_specs = sorted(set(specs) - set(SPECS))
          unknown_langs = sorted(set(langs) - set(LANGUAGES))
          if unknown_specs or unknown_langs:
              raise SystemExit(f"Unknown specs={unknown_specs}, languages={unknown_langs}")

          print("modules=" + json.dumps({"include": [{"module": m} for m in ["commons", *specs]]}))
          print("specs=" + json.dumps({"include": [{"spec": s} for s in specs]}))
          print("langs=" + json.dumps(langs))
          print("dry_run=" + os.environ["DRY_RUN"])
          PY

  generate:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Same pinned toolchain as the Docker Sandbox: Python, Node.js, JDK,
      # Maven, .NET SDK, uv and openapi-generator-cli from .mise.toml.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.5.2
          install: true
          cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-extras
      - name: Generate and verify builds
        env:
          SPECS: ${{ github.event.inputs.specs }}
          LANGS: ${{ github.event.inputs.langs }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          VERIFY_BUILDS: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.verify_builds != 'false' }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$SPECS" ]]; then
            read -r -a selected_specs <<< "$SPECS"
            args+=(--specs "${selected_specs[@]}")
          fi
          if [[ -n "$LANGS" ]]; then
            read -r -a selected_langs <<< "$LANGS"
            args+=(--langs "${selected_langs[@]}")
          fi
          if [[ -n "$PRERELEASE" ]]; then args+=(--prerelease "$PRERELEASE"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$VERIFY_BUILDS" != "true" || "$DRY_RUN" == "true" ]]; then
            args+=(--no-verify-builds)
          fi
          uv run python generate.py "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          name: generated-sources
          path: |
            target/generated-sources/
            !target/generated-sources/**/node_modules/**
            !target/generated-sources/**/bin/**
            !target/generated-sources/**/obj/**
          retention-days: 1

  publish-java:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"java"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: '17.0.21+9'
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # Instrument modules depend on the commons artifact of the same run;
      # resolve it from the local repository instead of racing its publication.
      - name: Install commons into the local Maven repository
        if: ${{ matrix.module != 'commons' }}
        working-directory: target/generated-sources/commons/java
        run: mvn --batch-mode -DskipTests install
      - name: Publish ${{ matrix.module }} to Maven Central
        working-directory: target/generated-sources/${{ matrix.module }}/java
        # The generated pom signs artifacts in its ``sign-artifacts`` profile;
        # Maven Central rejects unsigned bundles.
        run: mvn --batch-mode deploy -P sign-artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-npm-commons:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"typescript-angular"') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org
      - name: Publish commons npm package
        working-directory: target/generated-sources/commons/typescript
        # ``npm install`` runs the ``prepare`` build; ng-packagr writes the
        # publishable Angular package (compiled code + metadata) to dist/.
        # Pre-releases go to their dist-tag (alpha/beta/rc), never to latest.
        run: |
          tag=latest
          if [[ -n "$PRERELEASE" ]]; then tag="${PRERELEASE%%.*}"; fi
          npm install
          npm publish ./dist --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}

  publish-npm-specs:
    needs: [prepare, generate, publish-npm-commons]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"typescript-angular"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.specs) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org
      - name: Publish ${{ matrix.spec }} npm package
        working-directory: target/generated-sources/${{ matrix.spec }}/typescript
        # Pre-releases go to their dist-tag (alpha/beta/rc), never to latest.
        run: |
          tag=latest
          if [[ -n "$PRERELEASE" ]]; then tag="${PRERELEASE%%.*}"; fi
          npm install
          npm publish ./dist --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}

  publish-nuget:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"csharp"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.428
      # Instrument packages reference the commons package of the same run;
      # restore it from a local feed instead of racing its publication.
      - name: Pack commons into a local feed
        if: ${{ matrix.module != 'commons' }}
        working-directory: target/generated-sources/commons/csharp
        run: dotnet pack --configuration Release --output "$RUNNER_TEMP/commons-feed"
      - name: Pack and publish ${{ matrix.module }} NuGet package
        working-directory: target/generated-sources/${{ matrix.module }}/csharp
        run: |
          mkdir -p "$RUNNER_TEMP/commons-feed"
          dotnet pack --configuration Release --output "$RUNNER_TEMP/packages" \
            "-p:RestoreAdditionalProjectSources=$RUNNER_TEMP/commons-feed"
          dotnet nuget push "$RUNNER_TEMP"/packages/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-pypi:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"python"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.16'
      - name: Build Python distribution
        working-directory: target/generated-sources/${{ matrix.module }}/python
        run: |
          python -m pip install build==1.6.1 twine==6.2.0
          python -m build
      - name: Publish ${{ matrix.module }} to PyPI
        working-directory: target/generated-sources/${{ matrix.module }}/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
