name: Generate and publish Allotrope models

on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/**.yaml'
      - 'generate.py'
      - 'verify_builds.py'
      - 'allotrope_gen/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.devcontainer/**'
      - '.python-version'
      - '.nvmrc'
      - '.tool-versions'
      - 'openapitools.json'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Specs to generate (space-separated, empty = all)'
        required: false
        default: ''
      langs:
        description: 'Languages to generate (space-separated, empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (print commands only)'
        type: boolean
        default: false
      verify_builds:
        description: 'Build generated modules before publishing'
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.select.outputs.modules }}
      specs: ${{ steps.select.outputs.specs }}
      langs: ${{ steps.select.outputs.langs }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.16'
      - id: select
        name: Resolve selected specs and languages
        env:
          REQUESTED_SPECS: ${{ github.event.inputs.specs }}
          REQUESTED_LANGS: ${{ github.event.inputs.langs }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from allotrope_gen.config import LANGUAGES, SPECS

          specs = os.environ["REQUESTED_SPECS"].split() or list(SPECS)
          langs = os.environ["REQUESTED_LANGS"].split() or list(LANGUAGES)
          unknown_specs = sorted(set(specs) - set(SPECS))
          unknown_langs = sorted(set(langs) - set(LANGUAGES))
          if unknown_specs or unknown_langs:
              raise SystemExit(f"Unknown specs={unknown_specs}, languages={unknown_langs}")

          print("modules=" + json.dumps({"include": [{"module": m} for m in ["commons", *specs]]}))
          print("specs=" + json.dumps({"include": [{"spec": s} for s in specs]}))
          print("langs=" + json.dumps(langs))
          print("dry_run=" + os.environ["DRY_RUN"])
          PY

  generate:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate and verify in the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          runCmd: |
            set -euo pipefail
            args=()
            if [[ -n "$SPECS" ]]; then
              read -r -a selected_specs <<< "$SPECS"
              args+=(--specs "${selected_specs[@]}")
            fi
            if [[ -n "$LANGS" ]]; then
              read -r -a selected_langs <<< "$LANGS"
              args+=(--langs "${selected_langs[@]}")
            fi
            if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
            if [[ "$VERIFY_BUILDS" != "true" || "$DRY_RUN" == "true" ]]; then
              args+=(--no-verify-builds)
            fi
            python generate.py "${args[@]}"
          env: |
            SPECS=${{ github.event.inputs.specs }}
            LANGS=${{ github.event.inputs.langs }}
            DRY_RUN=${{ needs.prepare.outputs.dry_run }}
            VERIFY_BUILDS=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.verify_builds != 'false' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          name: generated-sources
          path: |
            target/generated-sources/
            !target/generated-sources/**/node_modules/**
          retention-days: 1

  publish-java:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"java"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: '17.0.21+9'
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Publish ${{ matrix.module }} to Maven Central
        working-directory: target/generated-sources/${{ matrix.module }}/java
        run: mvn --batch-mode deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-npm-commons:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"typescript-angular"') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org
      - name: Publish commons npm package
        working-directory: target/generated-sources/commons/typescript/common
        run: npm install && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-specs:
    needs: [prepare, generate, publish-npm-commons]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"typescript-angular"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.specs) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org
      - name: Publish ${{ matrix.spec }} npm package
        working-directory: target/generated-sources/${{ matrix.spec }}/typescript
        run: npm install && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-nuget:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"csharp"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.428
      - name: Pack and publish ${{ matrix.module }} NuGet package
        working-directory: target/generated-sources/${{ matrix.module }}/csharp
        run: |
          dotnet pack --configuration Release
          dotnet nuget push **/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-pypi:
    needs: [prepare, generate]
    if: ${{ needs.prepare.outputs.dry_run != 'true' && contains(needs.prepare.outputs.langs, '"python"') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-sources
          path: target/generated-sources/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.16'
      - name: Build Python distribution
        working-directory: target/generated-sources/${{ matrix.module }}/python
        run: |
          python -m pip install build==1.6.1 twine==6.2.0
          python -m build
      - name: Publish ${{ matrix.module }} to PyPI
        working-directory: target/generated-sources/${{ matrix.module }}/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
